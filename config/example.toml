# stormd — Container Init Configuration
# Place at /etc/stormd/config.toml (or specify with --config).
#
# Every key stormd reads is shown here, with its default. The full reference,
# with what each one does, is the "Configuration reference" in README.md.
# This file is parsed by a unit test (config::tests), so it cannot drift into
# something stormd would refuse to start on.

[general]
name = "my-service"             # shown in the UI, event lines, metrics labels
log_dir = "/var/log/stormd"     # per-process log files + .cloudid; put it on a volume:
                                # a stormcos golden mounts its -logs volume here; a pod
                                # wants a PVC (on stormcos, the built-in stormblock driver)
# cloud_id = "my-unique-id"     # else $STORM_CLOUD_ID, else {log_dir}/.cloudid, else a new UUID
# theme = "storm"               # default web UI theme; a viewer's own pick wins

[api]
bind = "0.0.0.0:9080"           # REST API, WebSockets, /metrics and the web UI
# TLS: both or neither. Re-read when either file changes (stormcert rotation).
# tls_cert_file = "/data/stormcert/serving.crt"
# tls_key_file = "/data/stormcert/serving.key"
# Any credential below turns authentication on; only /api/v1/health, /healthz,
# the login screen and /api/v1/auth/* stay open (/metrics too needs one).
# client_ca_file = "/data/stormcert/ca.crt"   # needs TLS; a client cert from this CA is let in
# token_file = "/etc/stormd/api-token"        # bearer token, read from a file, re-read on change
# auth_token = "secret-token"   # machine credential: Authorization: Bearer <token>
# password = "changeme"         # legacy: user "admin" with this password # not a secret: test fixture
# [[api.users]]
# name = "ops"
# password = "changeme" # not a secret: test fixture
# [api.hosts]                   # Host: header on "/" -> redirect target
# "manager.example.lo" = "/ui/"

# --- Logging ---

# Rotation and retention. The directory is [general] log_dir.
[stormlog.file]
max_size_bytes = 104857600  # 100 MiB before a file rotates
max_files = 10              # rotated generations kept, per process
max_runs = 10               # finished runs kept, per process

# Where lines go on the network. Emitting only — a collector (mcastsyslog)
# receives, stores and indexes. Defaults to the fleet group, so a container is
# watchable with no configuration at all. "off" sends nothing.
[stormlog.mcast]
# group = "239.255.42.1:5514"
# host = "node1"            # syslog HOSTNAME; defaults to this machine's hostname

[stormlog.terminal]
rows = 24
cols = 80
scrollback = 1000

# --- SSH Server ---

[ssh]
enabled = true
bind = "0.0.0.0:22"
host_key = "/etc/stormd/host_key"   # generated (ed25519) if missing
password = "stormd"                 # the cloud_id is accepted as well
# owner = "my-namespace"            # turns on public-key auth from CloudID
# cloudid_url = "http://169.254.169.254"

# --- Supervised Processes ---

[[process]]
name = "db"
command = "/app/db"
args = ["--data-dir", "/data/db", "--listen", "${NODE_IP}:5432"]  # ${NODE_IP}/${NODE_NAME} filled at spawn
on_failure = "restart"
restart_delay_secs = 3
max_restarts = 10
ready_probe = { type = "tcp", port = 5432, interval_secs = 2 }

# Kubernetes-style probes (stormd#48): same fields and meaning as a container
# spec (camelCase spellings accepted). The startup probe gates the others, so a
# slow first start (here up to 60 × 2 s) is never killed.
[process.startup_probe]
tcp_socket = { port = 5432 }
period_seconds = 2
failure_threshold = 60

[process.liveness_probe]          # failing failure_threshold times → SIGTERM, restart
tcp_socket = { port = 5432 }
period_seconds = 10               # defaults: period 10, timeout 1, thresholds 3 / 1

[[process]]
name = "main-app"
command = "/app/server"
args = ["--port", "3000"]
env = { DATABASE_URL = "postgres://127.0.0.1:5432/app" }    # always set, over stormd's own env
# Set only when stormd did not inherit the key, so the node can override it
# (stormpump env.d/<spec>); env above still wins over both.
env_default = { APP_DATA_DIR = "/data/app", APP_PEER = "${NODE_IP}:7000" }
on_failure = "restart"          # restart | fail | ignore
on_exit = "restart"             # restart | stop
restart_delay_secs = 5          # base; doubles per restart in the window, capped at 30s
max_restarts = 10
restart_window_secs = 3600
# Exits the process itself says a restart will not fix — a config it cannot
# run on (sysexits 78 EX_CONFIG, 64 EX_USAGE). Not restarted, not counted;
# the process is marked failed and on_no_restart decides the container.
no_restart_exit_codes = [78]
on_no_restart = "hold"          # hold (default) | fail
depends_on = ["db"]             # waits until db is running and its ready_probe passed
# First start only once these exist (e.g. a cert pair another container mints);
# polled every 250 ms, not counted as restarts. Absolute paths.
wait_for_files = ["/etc/stormcert/app.crt", "/etc/stormcert/app.key"]
stop_timeout_secs = 15          # on a stop: SIGTERM, up to 15 s, then SIGKILL (default 10)
# startup_delay_secs = 0
# working_dir = "/app"

[process.readiness_probe]         # not ready while failing; never restarts
http_get = { path = "/health", port = 3000 }

# Adds a tab to the web UI, reverse-proxied at /ui/proxy/main-app/
[process.ui]
label = "App"
proxy = "http://127.0.0.1:3000"
# host = "app.example.lo"       # Host: header on "/" -> this plugin's UI
# summary = "http://127.0.0.1:3000/api/summary"

[[process]]
name = "migrate"
command = "/app/migrate"
on_failure = "fail"             # a failed migration fails the container
on_exit = "stop"                # one-shot: done is done — its dependents
                                # start only after it exits 0
depends_on = ["db"]

# Its real APIs, probed for health (stormd#49): healthy / slow / stalled / down,
# each change logged and kept; GET /api/v1/health/apis serves them.
[[process.api]]
name = "status"
url = "http://127.0.0.1:8080/api/v1/status"
interval_secs = 15
timeout_secs = 5
p50_ms = 50                                # budgets: over → "slow"
p99_ms = 500
# token_file = "/run/app/token"
# restart_after_stalled_secs = 300         # opt-in; never by default

# A process given goldens (stormblock), read-only, before it first starts.
# stormd attaches each one ro over ublk from this node's engine and presents
# it: a filesystem golden is mounted read-only, an image golden is a device
# node the service can read. Swap one at runtime with
# PUT /api/v1/processes/share/goldens/<name> {"golden": "..."}.
[[process]]
name = "share"
command = "/app/share"

[[process.golden]]
name = "nic-drivers"                       # default path /goldens/nic-drivers
golden = "golden-nic-drivers-56ea4782ef2a" # or volume_id = "<uuid>"
content = "filesystem"                     # mounted read-only
# fstype = "ext4"

[[process.golden]]
name = "boot"
golden = "golden-boot-0123456789ab"
content = "image"                          # a device node at path
path = "/srv/boot/boot.img"
owner = "65532:65532"                      # so an unprivileged service can read it
mode = 0o440                               # default 0o444
size_bytes = 268435456                     # the image's own length (the volume is larger)

# --- Cron Jobs ---

[[cron]]
name = "cleanup"
schedule = "0 0 * * * *"       # every hour (sec min hour dom month dow)
command = "/app/cleanup"
args = []
# env = { KEY = "value" }
timeout_secs = 60              # default 300; killed and recorded as failed after this
capture_output = true          # output logged as process "cron.cleanup" when the job ends

# --- Events ---
# Every event is written to the log regardless; this adds a webhook.

[events]
enabled = false
transport = "webhook"           # none | webhook
# webhook_url = "http://monitor:9090/events"
# webhook_headers = { "Authorization" = "Bearer token" }

# --- Log Backup ---

[backup]
enabled = false
on_failure = true               # ship logs when the container fails
# destination_url = "http://backup:9091/upload"   # required when enabled
# headers = { "X-Container" = "my-service" }
compress = true                 # tar.gz; false = plain tar

# --- Image updater ---

[updater]
enabled = false
poll_interval_secs = 60
data_dir = "/data/images"
rootfs_dir = "/data/rootfs"

# --- Goldens (stormblock) ---

[goldens]
engine_url = "http://${NODE_IP}:9090"      # this node's engine (ublk is local)
token_file = "/run/stormblock/engine/api_token"   # bound in from the node
dir = "/goldens"                           # where a golden with no path appears

# --- Debug ---

[debug]
enabled = false
allow_signal = false            # POST /api/v1/debug/processes/{name}/signal
allow_stdin = false             # POST /api/v1/debug/processes/{name}/stdin
