# stormd — Container Init Configuration
# Place at /etc/stormd/config.toml (or specify with --config)

[general]
name = "my-service"
log_dir = "/var/log/stormd"

[api]
bind = "0.0.0.0:8080"
# auth_token = "secret-token"    # Optional: require Bearer token for API

[log]
max_size_bytes = 104857600  # 100MB
max_files = 10
timestamps = true
json_format = false

# --- StormLog (structured logging) ---

# Where the lines are kept. Point log_dir at a volume and they outlive the
# container; leave it on the image's filesystem and they do not.
[stormlog.file]
log_dir = "/var/log/stormd"
max_size_bytes = 104857600  # 100 MiB before a file rotates
max_files = 10              # rotated generations kept, per process
max_runs = 10               # finished runs kept, per process

# Where they go on the network. Emitting only — a collector receives, stores
# and indexes; see mcastsyslog. Defaults to the fleet group, so a container is
# watchable with no configuration at all. Set to "off" to stay quiet.
[stormlog.mcast]
# group = "239.255.42.1:5514"

[stormlog.terminal]
rows = 24
cols = 80
scrollback = 1000

# --- SSH Server ---

[ssh]
enabled = true
bind = "0.0.0.0:22"
host_key = "/etc/stormd/host_key"
password = "stormd"
# authorized_keys = "/etc/stormd/authorized_keys"

# --- Supervised Processes ---

[[process]]
name = "miniminio"
command = "/miniminio"
args = ["--data-dir", "/data/minio"]
env = { MINIO_ROOT_USER = "stormd", MINIO_ROOT_PASSWORD = "stormdpass" }
on_failure = "restart"
restart_delay_secs = 3
max_restarts = 10

[[process]]
name = "main-app"
command = "/app/server"
args = ["--port", "3000"]
on_failure = "restart"          # restart | fail | ignore
restart_delay_secs = 5
max_restarts = 10
restart_window_secs = 3600
# Exits the process itself says a restart will not fix — a config it cannot
# run on (sysexits 78 EX_CONFIG, 64 EX_USAGE). Not restarted, not counted;
# the process is marked failed and on_no_restart decides the container.
# no_restart_exit_codes = [78]
# on_no_restart = "hold"        # hold (default) | fail
depends_on = ["miniminio"]
# startup_delay_secs = 0
# working_dir = "/app"
# env = { DATABASE_URL = "postgres://..." }
# ready_probe = { type = "http", url = "http://localhost:3000/health", interval_secs = 2 }

[[process]]
name = "sidecar"
command = "/app/sidecar"
on_failure = "ignore"
depends_on = ["main-app"]
startup_delay_secs = 2

# --- Cron Jobs ---

[[cron]]
name = "cleanup"
schedule = "0 0 * * * *"       # Every hour (sec min hour dom month dow)
command = "/app/cleanup"
timeout_secs = 60
capture_output = true

# --- Events ---

[events]
enabled = false
transport = "nats"              # nats | webhook | both | none
# nats_url = "nats://nats:4222"
# nats_subject = "stormd.events"
# webhook_url = "http://monitor:9090/events"
# webhook_headers = { "Authorization" = "Bearer token" }

# --- Log Backup ---

[backup]
enabled = false
on_failure = true               # Ship logs when container fails
# destination_url = "http://backup:9091/upload"
# headers = { "X-Container" = "my-service" }
compress = true

# --- Debug ---

[debug]
enabled = false
allow_signal = false            # Allow sending signals via API
allow_stdin = false             # Allow writing to process stdin via API
dynamic_log_level = false
