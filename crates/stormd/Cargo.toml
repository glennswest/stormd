[package]
name = "stormd"
version = "0.8.0"
edition.workspace = true
license.workspace = true
description = "Container init system for scratch images — process supervisor, REST API, SSH shell, logging, events"

[dependencies]
stormlog = { path = "../stormlog", default-features = false }
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
serde_ignored = "0.1"
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
reqwest.workspace = true
tower.workspace = true
tower-http.workspace = true
thiserror.workspace = true
anyhow.workspace = true
cron.workspace = true
clap.workspace = true
flate2.workspace = true
tar.workspace = true
tokio-util.workspace = true
russh.workspace = true
russh-keys.workspace = true
russh-sftp = { path = "../../vendor/russh-sftp" }
futures-util.workspace = true
async-trait.workspace = true
stormpull.workspace = true
oci-spec.workspace = true
sha2.workspace = true
hex.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
stormview.workspace = true
# API over TLS (stormd#32): the same rustls/ring stack reqwest already pulls in
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "fs", "user", "mount"] }
libc = "0.2"

[features]
default = []
