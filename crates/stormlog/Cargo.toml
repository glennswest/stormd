[package]
name = "stormlog"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Structured logging library — VT100 terminal emulation, S3 storage, syslog, broadcast streams"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
vt100.workspace = true
rust-s3 = { workspace = true, optional = true }
tokio-util.workspace = true

[features]
# No S3 by default. Archiving logs to object storage is a collector's job, and
# a container init that carries an S3 client by default is carrying it for
# every image built on it.
default = []
s3 = ["dep:rust-s3"]
